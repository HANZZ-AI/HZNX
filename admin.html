<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HZNX - Admin Panel</title>
  <link rel="icon" type="image/png" href="src/assets/img/icon/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh; background: #0a0a0a;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(255, 0, 0, 0.12), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 0, 0.08), transparent 40%);
      color: #e5e5e5; padding: 24px;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 22px; background: #111;
      border: 1px solid #2a0000; border-radius: 12px;
      box-shadow: 0 0 22px rgba(255, 0, 0, 0.22);
      margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 42px; height: 42px; object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.7));
    }
    .brand h1 {
      font-size: 20px; letter-spacing: 3px; color: #ff2b2b;
      text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
    }
    .brand small {
      display: block; color: #888; font-size: 11px;
      letter-spacing: 2px; font-weight: normal; margin-top: 2px;
    }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-info .who { text-align: right; font-size: 13px; }
    .user-info .who strong { color: #ff2b2b; }
    .nav-links { display: flex; gap: 8px; }
    .nav-links a {
      padding: 8px 14px; color: #ccc; text-decoration: none;
      border: 1px solid #330000; border-radius: 8px;
      font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
      font-weight: bold; transition: 0.3s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #ff2b2b; border-color: #ff2b2b;
      box-shadow: 0 0 12px rgba(255,0,0,0.5);
    }
    .logout-btn {
      padding: 9px 16px; background: transparent;
      color: #ff2b2b; border: 1px solid #ff2b2b; border-radius: 8px;
      font-size: 12px; font-weight: bold; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer; transition: 0.3s;
    }
    .logout-btn:hover {
      background: rgba(255,0,0,0.12);
      box-shadow: 0 0 15px rgba(255,0,0,0.6);
    }
    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #111; border: 1px solid #2a0000; border-radius: 12px;
      padding: 24px; box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
    }
    .card h2 {
      color: #ff2b2b; letter-spacing: 2.5px; text-transform: uppercase;
      font-size: 16px; margin-bottom: 18px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.55);
      padding-bottom: 12px; border-bottom: 1px solid #2a0000;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; margin-bottom: 6px; color: #ccc;
      font-size: 13px; letter-spacing: 1px;
    }
    .input-wrap input, .input-wrap select {
      width: 100%; padding: 11px; background: #1a1a1a;
      border: 1px solid #330000; border-radius: 8px;
      font-size: 14px; color: #fff; transition: 0.3s; font-family: inherit;
    }
    .input-wrap select { cursor: pointer; }
    .input-wrap input::placeholder { color: #666; }
    .input-wrap input:focus, .input-wrap select:focus {
      border-color: #ff2b2b; outline: none;
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.25), 0 0 12px rgba(255, 0, 0, 0.4);
      background: #1f0a0a;
    }
    .btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #b30000, #ff1a1a);
      color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: bold; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer; transition: 0.3s;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.45);
    }
    .btn:hover {
      background: linear-gradient(135deg, #ff1a1a, #ff4444);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
    }
    .btn:disabled { background: #4d0000; box-shadow: none; cursor: not-allowed; color: #999; }
    .btn.danger {
      background: transparent; color: #ff2b2b;
      border: 1px solid #ff2b2b; box-shadow: none; margin-top: 14px;
    }
    .btn.danger:hover {
      background: rgba(255,0,0,0.12);
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
    }
    .msg { display: none; margin-top: 12px; font-size: 13px; text-align: center; }
    .msg.error { color: #ff2b2b; text-shadow: 0 0 8px rgba(255,0,0,0.6); }
    .msg.success { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,0.6); }
    .search-wrap { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-wrap input {
      flex: 1; min-width: 180px; padding: 11px; background: #1a1a1a;
      border: 1px solid #330000; border-radius: 8px;
      font-size: 14px; color: #fff; transition: 0.3s;
    }
    .search-wrap input::placeholder { color: #666; }
    .search-wrap input:focus {
      border-color: #ff2b2b; outline: none;
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.25), 0 0 12px rgba(255, 0, 0, 0.4);
      background: #1f0a0a;
    }
    .search-wrap button {
      padding: 0 20px; background: linear-gradient(135deg, #b30000, #ff1a1a);
      color: #fff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: bold; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer; transition: 0.3s;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.45);
    }
    .search-wrap button:hover {
      background: linear-gradient(135deg, #ff1a1a, #ff4444);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
    }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-tabs button {
      padding: 8px 16px; background: #1a1a1a; color: #ccc;
      border: 1px solid #330000; border-radius: 999px;
      font-size: 12px; font-weight: bold; letter-spacing: 1.2px;
      text-transform: uppercase; cursor: pointer; transition: 0.3s;
    }
    .filter-tabs button:hover { border-color: #ff2b2b; color: #ff2b2b; }
    .filter-tabs button.active {
      background: linear-gradient(135deg, #b30000, #ff1a1a);
      color: #fff; border-color: #ff2b2b;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }
    .user-list {
      display: flex; flex-direction: column; gap: 10px;
      max-height: 480px; overflow-y: auto; padding-right: 6px;
    }
    .user-list::-webkit-scrollbar { width: 8px; }
    .user-list::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
    .user-list::-webkit-scrollbar-thumb { background: #4d0000; border-radius: 4px; }
    .user-list::-webkit-scrollbar-thumb:hover { background: #ff2b2b; }
    .user-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: #161616;
      border: 1px solid #2a0000; border-radius: 10px;
      transition: 0.25s; gap: 12px;
    }
    .user-item:hover {
      border-color: #ff2b2b;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      transform: translateY(-1px);
    }
    .user-item .info { display: flex; flex-direction: column; gap: 3px; }
    .user-item .uname { font-weight: bold; color: #fff; font-size: 15px; letter-spacing: 0.5px; }
    .user-item .pass { font-size: 12px; color: #777; font-family: 'Consolas', monospace; }
    .role-badge {
      padding: 5px 12px; border-radius: 999px;
      font-size: 11px; font-weight: bold; letter-spacing: 1.5px;
      text-transform: uppercase; white-space: nowrap;
    }
    .role-Member {
      color: #22c55e; background: rgba(34, 197, 94, 0.12);
      border: 1px solid #22c55e;
      text-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
    }
    .role-VIP {
      color: #facc15; background: rgba(250, 204, 21, 0.12);
      border: 1px solid #facc15;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.7);
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.25);
    }
    .role-Admin {
      color: #ff2b2b; background: rgba(255, 43, 43, 0.12);
      border: 1px solid #ff2b2b;
      text-shadow: 0 0 8px rgba(255, 43, 43, 0.7);
      box-shadow: 0 0 10px rgba(255, 43, 43, 0.35);
    }
    .empty { text-align: center; color: #666; padding: 30px 10px; font-size: 14px; }

    /* ================= OVERLAY ================= */
    .overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 999; backdrop-filter: blur(3px);
    }
    .overlay.show { display: flex; }
    .spinner {
      width: 50px; height: 50px; border: 4px solid #2a0000;
      border-top-color: #ff2b2b; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ================= MODAL ================= */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-backdrop.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: #111;
      border: 1px solid #2a0000;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.35), 0 20px 60px rgba(0, 0, 0, 0.9);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal-icon {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .modal-icon svg { width: 36px; height: 36px; }

    .modal-icon.danger {
      background: rgba(255, 43, 43, 0.12);
      border: 2px solid #ff2b2b;
      box-shadow: 0 0 25px rgba(255, 43, 43, 0.5);
    }
    .modal-icon.danger svg { stroke: #ff2b2b; filter: drop-shadow(0 0 6px rgba(255,43,43,0.9)); }

    .modal-icon.success {
      background: rgba(34, 197, 94, 0.12);
      border: 2px solid #22c55e;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
    }
    .modal-icon.success svg { stroke: #22c55e; filter: drop-shadow(0 0 6px rgba(34,197,94,0.9)); }

    .modal-icon.info {
      background: rgba(250, 204, 21, 0.12);
      border: 2px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
    }
    .modal-icon.info svg { stroke: #facc15; filter: drop-shadow(0 0 6px rgba(250,204,21,0.9)); }

    .modal h3 {
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff2b2b;
      margin-bottom: 10px;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
    }
    .modal h3.success { color: #22c55e; text-shadow: 0 0 12px rgba(34,197,94,0.6); }
    .modal h3.info    { color: #facc15; text-shadow: 0 0 12px rgba(250,204,21,0.6); }

    .modal p {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
      word-break: break-word;
    }
    .modal p strong { color: #ff2b2b; }

    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .modal-actions .btn { flex: 1; margin: 0; }

    .modal-actions .btn-ghost {
      padding: 12px;
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }
    .modal-actions .btn-ghost:hover {
      color: #fff;
      border-color: #888;
      background: rgba(255,255,255,0.03);
    }

    .modal-actions .btn-confirm-danger {
      padding: 12px;
      background: linear-gradient(135deg, #b30000, #ff1a1a);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      font-family: inherit;
    }
    .modal-actions .btn-confirm-danger:hover {
      background: linear-gradient(135deg, #ff1a1a, #ff4444);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.85);
    }
    .modal-actions .btn-confirm-success {
      padding: 12px;
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
      font-family: inherit;
    }
    .modal-actions .btn-confirm-success:hover {
      background: linear-gradient(135deg, #22c55e, #4ade80);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.85);
    }
  </style>
</head>
<body>

  <!-- 🔒 GUARD -->
  <script>
    (function guard() {
      const SESSION_KEY = 'hznxSession';
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) {
        window.location.replace('index.html');
        throw new Error('redirect');
      }
      let user;
      try { user = JSON.parse(raw); }
      catch (e) {
        localStorage.removeItem(SESSION_KEY);
        window.location.replace('index.html');
        throw new Error('redirect');
      }
      if (!user || !user.username || user.role !== 'Admin') {
        window.location.replace('dashboard.html');
        throw new Error('redirect');
      }
    })();
  </script>

  <!-- Loading Overlay -->
  <div class="overlay" id="overlay"><div class="spinner"></div></div>

  <!-- ============================================================== -->
  <!-- MODAL (satu modal, kontennya di-inject lewat JS) -->
  <!-- ============================================================== -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBox">
      <div class="modal-icon" id="modalIcon"></div>
      <h3 id="modalTitle"></h3>
      <p id="modalMessage"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">
      <img src="src/assets/img/icon/icon.png" alt="HZNX">
      <div>
        <h1>HZNX Admin</h1>
        <small>Control Panel</small>
      </div>
    </div>
    <div class="nav-links">
      <a href="admin.html" class="active">Admin</a>
      <a href="dashboard.html">Dashboard</a>

    <div class="user-info">

  <div class="grid">
    <div>
      <div class="card" style="margin-bottom: 22px;">
        <h2>Tambah User</h2>
        <form id="addForm" autocomplete="off">
          <div class="form-group">
            <label for="newUsername">Username</label>
            <div class="input-wrap">
              <input type="text" id="newUsername" placeholder="Masukkan username" required>
            </div>
          </div>
          <div class="form-group">
            <label for="newPassword">Password</label>
            <div class="input-wrap">
              <input type="text" id="newPassword" placeholder="Masukkan password" required>
            </div>
          </div>
          <div class="form-group">
            <label for="newRole">Role</label>
            <div class="input-wrap">
              <select id="newRole" required>
                <option value="Member">Member</option>

      <div class="card">
        <h2>Hapus User</h2>
        <form id="deleteForm" autocomplete="off">
          <div class="form-group">
            <label for="deleteUsername">Username</label>
            <div class="input-wrap">
              <input type="text" id="deleteUsername" placeholder="Username yang akan dihapus" required>
            </div>
          </div>
          <button type="submit" class="btn danger" id="deleteBtn">Hapus User</button>
          <p class="msg" id="deleteMsg"></p>
        </form>
      </div>
    </div>

    <div class="card">
      <h2>Daftar User</h2>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Cari username...">
        <button id="searchBtn">Search</button>
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="active" data-filter="All">All</button>
        <button data-filter="Member">Member</button>
        <button data-filter="VIP">VIP</button>
        <button data-filter="Admin">Admin</button>
      </div>
      <div class="user-list" id="userList">
        <div class="empty">Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIG
    // ============================================================
    const GITHUB_TOKEN  = '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'; // ← GANTI
    const GITHUB_OWNER  = 'HANZZ-AI';
    const GITHUB_REPO   = 'HZNX';
    const GITHUB_BRANCH = 'main';
    const USERS_PATH    = 'users.json';
    const SESSION_KEY   = 'hznxSession';

    // ============================================================
    // MODAL SYSTEM
    // ============================================================
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalActions = document.getElementById('modalActions');

    // SVG ikon
    const ICONS = {
      danger: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                 <line x1="12" y1="9" x2="12" y2="13"/>
                 <line x1="12" y1="17" x2="12.01" y2="17"/>
               </svg>`,
      success: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>`,
      info: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <circle cx="12" cy="12" r="10"/>
               <line x1="12" y1="16" x2="12" y2="12"/>
               <line x1="12" y1="8" x2="12.01" y2="8"/>
             </svg>`
    };

    /**
     * Tampilkan modal
     * @param {Object} opts
     * @param {string} opts.type      - 'danger' | 'success' | 'info'
     * @param {string} opts.title     - Judul modal
     * @param {string} opts.message   - Isi pesan (boleh HTML sederhana)
     * @param {Array}  opts.buttons   - [{ label, style, onClick }]
     */
    function showModal({ type = 'info', title = '', message = '', buttons = [] }) {
      modalIcon.className = 'modal-icon ' + type;
      modalIcon.innerHTML = ICONS[type] || ICONS.info;
      modalTitle.className = type === 'success' ? 'success' : (type === 'info' ? 'info' : '');
      modalTitle.textContent = title;
      modalMessage.innerHTML = message;

      modalActions.innerHTML = '';
      buttons.forEach(btn => {
        const el = document.createElement('button');
        el.textContent = btn.label;
        el.className = btn.style || 'btn-ghost';
        el.addEventListener('click', () => {
          hideModal();
          if (typeof btn.onClick === 'function') btn.onClick();
        });
        modalActions.appendChild(el);
      });

      modalBackdrop.classList.add('show');
    }

    function hideModal() {
      modalBackdrop.classList.remove('show');
    }

    // Tutup modal kalau klik backdrop
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) hideModal();
    });
    // Tutup modal kalau tekan ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('show')) hideModal();
    });

    // Helper: modal info/success biasa (1 tombol OK)
    function alertModal(type, title, message) {
      return new Promise(resolve => {
        showModal({
          type, title, message,
          buttons: [{
            label: 'OK',
            style: type === 'success' ? 'btn-confirm-success' : 'btn-confirm-danger',
            onClick: () => resolve(true)
          }]
        });
      });
    }

    // Helper: modal konfirmasi (2 tombol) → Promise<boolean>
    function confirmModal(title, message, confirmLabel = 'Ya, Hapus') {
      return new Promise(resolve => {
        showModal({
          type: 'danger',
          title,
          message,
          buttons: [
            { label: 'Batal', style: 'btn-ghost', onClick: () => resolve(false) },
            { label: confirmLabel, style: 'btn-confirm-danger', onClick: () => resolve(true) }
          ]
        });
      });
    }

    // ============================================================
    // USER
    // ============================================================
    const me = JSON.parse(localStorage.getItem(SESSION_KEY));
    document.getElementById('currentUser').textContent = me.username + ' (Admin)';

    const apiURL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${USERS_PATH}`;
    const headers = {
      'Authorization': `Bearer ${GITHUB_TOKEN}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
    const encodeBase64 = str => btoa(unescape(encodeURIComponent(str)));
    const decodeBase64 = str => decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));

    async function fetchUsersFile() {
      const res = await fetch(`${apiURL}?ref=${GITHUB_BRANCH}&t=${Date.now()}`, {
        headers, cache: 'no-store'
      });
      if (!res.ok) throw new Error(`Gagal baca users.json (HTTP ${res.status})`);
      const data = await res.json();
      const json = JSON.parse(decodeBase64(data.content));
      return { json, sha: data.sha };
    }

    async function saveUsersFile(json, sha, message) {
      const body = {
        message, content: encodeBase64(JSON.stringify(json, null, 2)),
        sha, branch: GITHUB_BRANCH
      };
      const res = await fetch(apiURL, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(`Gagal simpan (HTTP ${res.status}): ${errData.message || ''}`);
      }
      return res.json();
    }

    // ============================================================
    // STATE UI
    // ============================================================
    let allUsers = [];
    let currentFilter = 'All';
    let currentSearch = '';
    const overlay = document.getElementById('overlay');
    const userListEl = document.getElementById('userList');
    const showOverlay = (s) => overlay.classList.toggle('show', s);

    function setMsg(el, text, type) {
      el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
    }
    function clearMsg(el) { el.textContent = ''; el.style.display = 'none'; }
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function renderUsers() {
      const q = currentSearch.trim().toLowerCase();
      const filtered = allUsers.filter(u => {
        const matchRole = currentFilter === 'All' || u.role === currentFilter;
        const matchSearch = !q || u.username.toLowerCase().includes(q);
        return matchRole && matchSearch;
      });

      if (filtered.length === 0) {
        userListEl.innerHTML = '<div class="empty">Tidak ada user ditemukan.</div>';
        return;
      }
      userListEl.innerHTML = filtered.map(u => `
        <div class="user-item">
          <div class="info">
            <span class="uname">${escapeHtml(u.username)}</span>
            <span class="pass">${escapeHtml(u.password)}</span>
          </div>
          <span class="role-badge role-${escapeHtml(u.role)}">${escapeHtml(u.role)}</span>
        </div>
      `).join('');
    }

    async function loadUsers() {
      try {
        showOverlay(true);
        const { json } = await fetchUsersFile();
        allUsers = (json.users || []).sort((a,b) => a.username.localeCompare(b.username));
        renderUsers();
      } catch (err) {
        userListEl.innerHTML = `<div class="empty" style="color:#ff2b2b;">${escapeHtml(err.message)}</div>`;
      } finally {
        showOverlay(false);
      }
    }

    // ============================================================
    // TAMBAH USER (validasi pakai modal)
    // ============================================================
    const addForm = document.getElementById('addForm');
    const addBtn = document.getElementById('addBtn');
    const addMsg = document.getElementById('addMsg');

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg(addMsg);
      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      const role = document.getElementById('newRole').value;

      if (!username || !password || !role) {
        return alertModal('danger', 'Field Kosong', 'Semua field wajib diisi.');
      }
      if (username.length < 3) {
        return alertModal('danger', 'Username Terlalu Pendek', 'Username minimal 3 karakter.');
      }
      if (password.length < 4) {
        return alertModal('danger', 'Password Terlalu Pendek', 'Password minimal 4 karakter.');
      }

      addBtn.disabled = true; addBtn.textContent = 'Memproses...';

      try {
        showOverlay(true);
        const { json, sha } = await fetchUsersFile();
        const users = json.users || [];
        if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
          showOverlay(false);
          return alertModal('danger', 'Username Duplikat',
            `Username <strong>${escapeHtml(username)}</strong> sudah terdaftar.`);
        }

        users.push({ username, password, role });
        json.users = users;
        await saveUsersFile(json, sha, `Admin: add user ${username} (${role})`);

        addForm.reset();
        allUsers = users.sort((a,b) => a.username.localeCompare(b.username));
        renderUsers();

        await alertModal('success', 'Berhasil',
          `User <strong>${escapeHtml(username)}</strong> berhasil ditambahkan sebagai <strong>${escapeHtml(role)}</strong>.`);
      } catch (err) {
        await alertModal('danger', 'Gagal', escapeHtml(err.message));
      } finally {
        addBtn.disabled = false; addBtn.textContent = 'Tambah User'; showOverlay(false);
      }
    });

    // ============================================================
    // HAPUS USER (pakai modal konfirmasi)
    // ============================================================
    const deleteForm = document.getElementById('deleteForm');
    const deleteBtn = document.getElementById('deleteBtn');
    const deleteMsg = document.getElementById('deleteMsg');

    deleteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg(deleteMsg);
      const username = document.getElementById('deleteUsername').value.trim();

      if (!username) {
        return alertModal('danger', 'Field Kosong', 'Username wajib diisi.');
      }
      if (me.username.toLowerCase() === username.toLowerCase()) {
        return alertModal('danger', 'Tidak Diizinkan',
          'Kamu tidak bisa menghapus akunmu sendiri.');
      }

      // Konfirmasi pakai modal
      const ok = await confirmModal(
        'Konfirmasi Hapus',
        `Yakin ingin menghapus user <strong>${escapeHtml(username)}</strong>?<br>Tindakan ini tidak bisa dibatalkan.`,
        'Ya, Hapus'
      );
      if (!ok) return;

      deleteBtn.disabled = true; deleteBtn.textContent = 'Memproses...';

      try {
        showOverlay(true);
        const { json, sha } = await fetchUsersFile();
        const before = (json.users || []).length;
        json.users = (json.users || []).filter(
          u => u.username.toLowerCase() !== username.toLowerCase()
        );
        if (json.users.length === before) {
          showOverlay(false);
          return alertModal('danger', 'Tidak Ditemukan',
            `User <strong>${escapeHtml(username)}</strong> tidak ditemukan.`);
        }

        await saveUsersFile(json, sha, `Admin: delete user ${username}`);

        deleteForm.reset();
        allUsers = json.users.sort((a,b) => a.username.localeCompare(b.username));
        renderUsers();

        await alertModal('success', 'Berhasil Dihapus',
          `User <strong>${escapeHtml(username)}</strong> berhasil dihapus.`);
      } catch (err) {
        await alertModal('danger', 'Gagal', escapeHtml(err.message));
      } finally {
        deleteBtn.disabled = false; deleteBtn.textContent = 'Hapus User'; showOverlay(false);
      }
    });

    // ============================================================
    // SEARCH + FILTER
    // ============================================================
    const searchInput = document.getElementById('searchInput');
    document.getElementById('searchBtn').addEventListener('click', () => {
      currentSearch = searchInput.value; renderUsers();
    });
    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value; renderUsers();
    });

    document.getElementById('filterTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      document.querySelectorAll('#filterTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderUsers();
    });

    // ============================================================
    // LOGOUT (pakai modal konfirmasi)
    // ============================================================
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const ok = await confirmModal(
        'Konfirmasi Logout',
        'Yakin ingin keluar dari akun ini?',
        'Ya, Logout'
      );
      if (ok) {
        localStorage.removeItem(SESSION_KEY);
        window.location.href = 'index.html';
      }
    });

    // INIT
    loadUsers();
  </script>
</body>
</html>
